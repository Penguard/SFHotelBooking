server:
  port: 8081
spring:
  application:
    name: hotel-service
  datasource:
    url: jdbc:h2:mem:hoteldb;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  h2:
    console:
      enabled: false
app:
  jwt:
    secret: ${JWT_SECRET:dev-only-change-this-secret-32-chars-minimum}
  admin:
    password: ${ADMIN_PASSWORD:Admin123!}
eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}
management:
  endpoints:
    web:
      exposure:
        include: health,info
logging:
  pattern:
    level: '%5p [trace=%X{traceId}]'
