services:
  eureka:
    build: { context: ., args: { MODULE: eureka-server } }
    ports: ["8761:8761"]
  hotel:
    build: { context: ., args: { MODULE: hotel-service } }
    ports: ["8081:8081"]
    environment:
      EUREKA_URI: http://eureka:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
    depends_on: [eureka]
  booking:
    build: { context: ., args: { MODULE: booking-service } }
    ports: ["8082:8082"]
    environment:
      EUREKA_URI: http://eureka:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
    depends_on: [eureka, hotel]
  gateway:
    build: { context: ., args: { MODULE: api-gateway } }
    ports: ["8080:8080"]
    environment:
      EUREKA_URI: http://eureka:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
    depends_on: [eureka, hotel, booking]
